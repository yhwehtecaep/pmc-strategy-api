name: Monthly Screen

# Cron alone can't express "the last day of the month" -- there's no such
# syntax. This runs the check every day from the 28th through the 31st
# (covering every possible month length) and the job itself checks
# whether TOMORROW is the 1st before actually triggering anything, so it
# only fires once per month regardless of whether that month has 28, 29,
# 30, or 31 days.
"on":
  schedule:
    - cron: "0 18 28-31 * *"  # 18:00 UTC daily from the 28th to month-end
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab too

jobs:
  trigger-monthly-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether today is actually the last day of the month
        id: check
        run: |
          TOMORROW=$(date -u -d "+1 day" +%d)
          if [ "$TOMORROW" == "01" ]; then
            echo "Today is the last day of the month -- proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the last day of the month -- skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger /monthly-screen
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${{ secrets.RENDER_SERVICE_URL }}/monthly-screen" \
            -H "Content-Type: application/json" \
            -H "X-Monthly-Screen-Secret: ${{ secrets.MONTHLY_SCREEN_SECRET }}" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\"}")

          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)

          if [ "$STATUS" != "200" ]; then
            echo "::error::Triggering /monthly-screen failed with HTTP $STATUS"
            exit 1
          fi

          echo "Monthly screen triggered successfully. Results will arrive on Telegram in a few minutes."
